services:
  db:
    container_name: sicop-db
    image: postgres:latest
    restart: unless-stopped
    shm_size: 128mb
    ports:
      - "5480:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pocoloco18
      POSTGRES_DB: sicop-db
    volumes:
      - ./volumes/db:/var/lib/postgresql/data
    networks:
      - sicop-network

  backend:
    image: sicop-back:latest
    container_name: sicop-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_started
    env_file:
      - ./backend/.env.production
    volumes:
      # Logs persistentes
      - ./backend/logs:/app/logs
      # Claves JWT
      - ./backend/private_key.pem:/app/private_key.pem
      - ./backend/public_key.pem:/app/public_key.pem
    networks:
      - sicop-network

  frontend:
    image: sicop-front:latest
    container_name: sicop-frontend
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      # Certificados SSL
      - ./ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - sicop-network

networks:
  sicop-network:
    driver: bridge