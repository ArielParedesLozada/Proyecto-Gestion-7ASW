services:
  backend:
    image: aparedeslozada/sicop-back:1
    container_name: sicop-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/private_key.pem:/app/private_key.pem:ro
      - ./backend/public_key.pem:/app/public_key.pem:ro
    networks:
      - sicop-network

  frontend:
    image: aparedeslozada/sicop-front:1
    container_name: sicop-frontend
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - sicop-network

networks:
  sicop-network:
    driver: bridge