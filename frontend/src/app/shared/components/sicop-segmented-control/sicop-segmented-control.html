<div
  class="sicop-segmented"
  role="tablist"
  [attr.aria-label]="ariaLabel()"
>
  @for (option of options(); track option.value) {
    <button
      type="button"
      role="tab"
      class="sicop-segmented__btn"
      [class.sicop-segmented__btn--active]="value() === option.value"
      [class.sicop-segmented__btn--success]="option.tone === 'success'"
      [class.sicop-segmented__btn--danger]="option.tone === 'danger'"
      [class.sicop-segmented__btn--warn]="option.tone === 'warn'"
      [attr.aria-selected]="value() === option.value"
      (click)="select(option.value)"
    >
      <span class="sicop-segmented__label">{{ option.label }}</span>
      @if (option.count !== undefined) {
        <span class="sicop-segmented__badge">{{ option.count }}</span>
      }
    </button>
  }
</div>
