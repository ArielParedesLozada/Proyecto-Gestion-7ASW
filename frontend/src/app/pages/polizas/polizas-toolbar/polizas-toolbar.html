<div class="list-toolbar polizas-toolbar">
  <div class="list-toolbar__main">
    <div class="list-toolbar__leading">
      <mat-form-field appearance="outline" class="list-toolbar__search" subscriptSizing="dynamic">
        <mat-icon matPrefix class="list-toolbar__search-icon">search</mat-icon>
        <input
          matInput
          placeholder="Buscar por número, contratista u obra..."
          [ngModel]="searchQuery()"
          (ngModelChange)="onSearchInput($event)"
        />
      </mat-form-field>
    </div>

    <div class="list-toolbar__actions polizas-toolbar__actions">
      <button
        type="button"
        mat-stroked-button
        class="list-toolbar__btn polizas-toolbar__btn-filters"
        [class.polizas-toolbar__btn-filters--active]="filtersExpanded()"
        [attr.aria-expanded]="filtersExpanded()"
        (click)="toggleFiltersPanel()"
      >
        <mat-icon>{{ filtersExpanded() ? 'expand_less' : 'tune' }}</mat-icon>
        {{ filtersButtonLabel() }}
      </button>

      <button
        type="button"
        mat-stroked-button
        class="list-toolbar__btn list-toolbar__btn-clear"
        (click)="onLimpiarFiltros()"
      >
        <mat-icon>filter_alt_off</mat-icon>
        Limpiar
      </button>

      <button type="button" mat-flat-button class="list-toolbar__btn polizas-toolbar__btn-excel" (click)="onCargarExcel()">
        <img class="polizas-toolbar__excel-img" src="/img/ExcelLogo.png" width="28" height="28" alt="" aria-hidden="true" />
        <span class="polizas-toolbar__btn-excel-label">Cargar por Excel</span>
      </button>

      <button type="button" mat-flat-button class="list-toolbar__btn list-toolbar__btn-primary" (click)="onNueva()">
        <mat-icon>add</mat-icon>
        Nueva Póliza
      </button>
    </div>
  </div>

  @if (filtersExpanded()) {
    <section class="polizas-toolbar__advanced" aria-label="Filtros avanzados">
      <div class="polizas-toolbar__grid">
        <mat-form-field appearance="outline" class="polizas-toolbar__field" subscriptSizing="dynamic">
          <mat-label>Contratista</mat-label>
          <input
            matInput
            [ngModel]="contratistaFiltro()"
            (ngModelChange)="contratistaFiltroChange.emit($event)"
          />
        </mat-form-field>

        <mat-form-field appearance="outline" class="polizas-toolbar__field" subscriptSizing="dynamic">
          <mat-label>Aseguradora</mat-label>
          <input
            matInput
            [ngModel]="aseguradoraFiltro()"
            (ngModelChange)="aseguradoraFiltroChange.emit($event)"
          />
        </mat-form-field>

        <app-vencimiento-date-range-fields
          class="polizas-toolbar__dates"
          fieldClass="polizas-toolbar__field"
          [fechaDesde]="fechaDesde()"
          [fechaHasta]="fechaHasta()"
          (fechaDesdeChange)="fechaDesdeChange.emit($event)"
          (fechaHastaChange)="fechaHastaChange.emit($event)"
        />

        <mat-form-field appearance="outline" class="polizas-toolbar__field" subscriptSizing="dynamic">
          <mat-label>Ramo</mat-label>
          <mat-select [ngModel]="ramoFiltro()" (ngModelChange)="onRamoChange($event)">
            <mat-option value="todos">Todos los ramos</mat-option>
            @for (ramo of ramos(); track ramo.id) {
              <mat-option [value]="ramo.id">{{ ramo.nombre }}</mat-option>
            }
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="polizas-toolbar__field" subscriptSizing="dynamic">
          <mat-label>Estado</mat-label>
          <mat-select
            [ngModel]="estadoFiltro()"
            (ngModelChange)="onEstadoChange($event)"
            panelClass="polizas-select-panel"
          >
            @for (opt of filtroOptions; track opt.value) {
              <mat-option [value]="opt.value">{{ opt.label }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>
    </section>
  }
</div>
