<div class="renovaciones-page">
  <header class="polizas-header renovaciones-header">
    <div class="renovaciones-header__intro">
      <h1 class="page-title">Renovaciones</h1>
      <p class="page-subtitle">Revisión y confirmación de renovaciones generadas automáticamente</p>
    </div>
    <div class="polizas-header__tools">
      <app-page-header-actions />
    </div>
  </header>

  <app-list-page-toolbar>
    <mat-form-field
      appearance="outline"
      class="list-toolbar__search"
      subscriptSizing="dynamic"
      listToolbarSearch
    >
      <mat-icon matPrefix class="list-toolbar__search-icon">search</mat-icon>
      <input
        matInput
        placeholder="Buscar por póliza, contratista u obra..."
        [ngModel]="searchQuery()"
        (ngModelChange)="searchQuery.set($event)"
      />
    </mat-form-field>

    <app-clear-filters-button listToolbarActions (clear)="limpiarFiltros()" />
  </app-list-page-toolbar>

  <app-renovaciones-table
    [rows]="pagedHistorial()"
    [paginatorLength]="totalFiltrado()"
    [pageIndex]="pageIndex()"
    [pageSize]="pageSize"
    (pageChange)="onPage($event)"
    (ver)="onVer($event)"
  />
</div>
