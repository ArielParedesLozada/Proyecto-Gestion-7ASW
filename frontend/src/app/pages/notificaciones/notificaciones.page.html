<div class="notificaciones-page">
  <header class="notificaciones-header">
    <div class="notificaciones-header__intro">
      <h1 class="page-title">Notificaciones</h1>
      <p class="page-subtitle">Historial de notificaciones enviadas y pendientes</p>
    </div>
    <div class="notificaciones-header__tools polizas-header__tools">
      <app-page-header-actions />
    </div>
  </header>

  <app-list-page-toolbar>
    <mat-form-field
      appearance="outline"
      class="list-toolbar__search"
      subscriptSizing="dynamic"
      listToolbarSearch
    >
      <mat-icon matPrefix class="list-toolbar__search-icon">search</mat-icon>
      <input
        matInput
        placeholder="Buscar por número de póliza u obra..."
        [ngModel]="searchQuery()"
        (ngModelChange)="searchQuery.set($event)"
      />
    </mat-form-field>

    <mat-form-field
      appearance="outline"
      class="list-toolbar__field"
      subscriptSizing="dynamic"
      listToolbarInline
    >
      <mat-label>Estado</mat-label>
      <mat-select [ngModel]="estadoFilter()" (ngModelChange)="estadoFilter.set($event)">
        <mat-option [value]="undefined">Todos</mat-option>
        <mat-option [value]="0">Enviada</mat-option>
        <mat-option [value]="1">Error</mat-option>
        <mat-option [value]="2">Pendiente</mat-option>
        <mat-option [value]="3">Invalidada</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field
      appearance="outline"
      class="list-toolbar__field"
      subscriptSizing="dynamic"
      listToolbarInline
    >
      <mat-label>Tipo</mat-label>
      <mat-select [ngModel]="tipoFilter()" (ngModelChange)="tipoFilter.set($event)">
        <mat-option [value]="undefined">Todos</mat-option>
        <mat-option [value]="0">Renovación</mat-option>
        <mat-option [value]="1">Expiración</mat-option>
      </mat-select>
    </mat-form-field>

    <app-clear-filters-button listToolbarActions (clear)="limpiarFiltros()" />
  </app-list-page-toolbar>

  <app-notificaciones-table
    [rows]="pagedNotificaciones()"
    [paginatorLength]="totalFiltrado()"
    [pageIndex]="pageIndex()"
    [pageSize]="pageSize"
    (pageChange)="onPage($event)"
  />
</div>
