<div class="auditorias-card">
    <h2 class="auditorias-card__title">Bitácora de Auditoría</h2>

    <div class="table-scroll">
        <table class="auditorias-table">
            <thead>
                <tr>
                    <th>Usuario</th>
                    <th>Tabla</th>
                    <th>Registro ID</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody>
                @for (row of rows(); track row.id) {
                <tr>
                    <td class="auditorias-table__username">{{ row.username }}</td>
                    <td>{{ row.tabla }}</td>
                    <td class="auditorias-table__registro-id">{{ row.registroId | slice:0:8 }}...</td>
                    <td>
                        <span
                            [class]="'auditorias-table__badge auditorias-table__badge--' + getAccionClass(row.accion)">
                            {{ row.accion }}
                        </span>
                    </td>
                </tr>
                } @empty {
                <tr>
                    <td colspan="6" class="auditorias-table__empty">No hay registros de auditoría.</td>
                </tr>
                }
            </tbody>
        </table>
    </div>

    <div class="auditorias-card__paginator">
        <app-local-paginator [length]="paginatorLength()" [pageIndex]="pageIndex()" [pageSize]="pageSize()"
            (page)="pageChange.emit($event)" />
    </div>
</div>
