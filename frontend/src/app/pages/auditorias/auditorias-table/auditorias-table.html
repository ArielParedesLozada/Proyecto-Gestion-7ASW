<app-sicop-data-table
  title="Bitácora de Auditoría"
  tableMinWidth="900px"
  [paginatorLength]="paginatorLength()"
  [pageIndex]="pageIndex()"
  [pageSize]="pageSize()"
  (pageChange)="pageChange.emit($event)"
>
  <tr sicopThead>
    <th>Usuario</th>
    <th>Tabla</th>
    <th>Registro ID</th>
    <th>Acción</th>
  </tr>

  @for (row of rows(); track row.id) {
    <tr>
      <td class="sicop-data-table__cell--strong">{{ row.username }}</td>
      <td>{{ row.tabla }}</td>
      <td class="auditorias-table__registro-id">{{ row.registroId | slice:0:8 }}...</td>
      <td>
        <span
          [class]="'auditorias-table__badge auditorias-table__badge--' + getAccionClass(row.accion)"
        >
          {{ row.accion }}
        </span>
      </td>
    </tr>
  } @empty {
    <tr>
      <td colspan="4" class="sicop-data-table__empty">No hay registros de auditoría.</td>
    </tr>
  }
</app-sicop-data-table>
