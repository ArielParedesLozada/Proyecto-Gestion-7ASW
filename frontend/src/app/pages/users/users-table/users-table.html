<app-sicop-data-table
  title="Listado de Usuarios"
  [paginatorLength]="paginatorLength()"
  [pageIndex]="pageIndex()"
  [pageSize]="pageSize()"
  (pageChange)="pageChange.emit($event)"
>
  <tr sicopThead>
    <th>Usuario</th>
    <th>Rol</th>
    <th>Email</th>
    <th class="sicop-data-table__col-actions">Acciones</th>
  </tr>

  @for (row of rows(); track row.id) {
    <tr>
      <td class="sicop-data-table__cell--strong">{{ row.username }}</td>
      <td>
        <span class="users-table__role" [class.users-table__role--admin]="row.role === 'ADMIN'">
          {{ rolEs(row.role) }}
        </span>
      </td>
      <td class="sicop-data-table__cell--muted">{{ row.email }}</td>
      <td>
        <div class="sicop-data-table__actions">
          <button
            type="button"
            mat-icon-button
            class="sicop-data-table__action-btn"
            aria-label="Editar"
            (click)="onEditar(row)"
          >
            <mat-icon>edit_square</mat-icon>
          </button>
        </div>
      </td>
    </tr>
  } @empty {
    <tr>
      <td colspan="4" class="sicop-data-table__empty">No hay usuarios que coincidan con los filtros.</td>
    </tr>
  }
</app-sicop-data-table>
