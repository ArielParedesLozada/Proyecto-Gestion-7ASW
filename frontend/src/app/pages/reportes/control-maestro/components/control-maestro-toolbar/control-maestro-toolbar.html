<div class="list-toolbar cm-toolbar">
  <div class="list-toolbar__main">
    <div class="list-toolbar__leading">
      <mat-form-field
        appearance="outline"
        class="list-toolbar__field cm-toolbar__saldo"
        subscriptSizing="dynamic"
      >
        <mat-label>Saldo inicial</mat-label>
        <input
          matInput
          type="number"
          [ngModel]="saldoInicial()"
          (ngModelChange)="onSaldoChange($event)"
        />
      </mat-form-field>
    </div>

    <div class="list-toolbar__actions">
      <button
        type="button"
        mat-stroked-button
        class="list-toolbar__btn list-toolbar__btn-filters"
        [class.list-toolbar__btn-filters--active]="filtersExpanded()"
        [attr.aria-expanded]="filtersExpanded()"
        (click)="toggleFiltersPanel()"
      >
        <mat-icon>{{ filtersExpanded() ? 'expand_less' : 'tune' }}</mat-icon>
        {{ filtersButtonLabel() }}
      </button>

      <app-clear-filters-button (clear)="onLimpiar()" />

      <button
        type="button"
        mat-stroked-button
        class="list-toolbar__btn list-toolbar__btn-secondary"
        (click)="exportarPdf.emit()"
      >
        <mat-icon>picture_as_pdf</mat-icon>
        PDF
      </button>
    </div>
  </div>

  @if (filtersExpanded()) {
    <section class="list-toolbar__advanced" aria-label="Filtros del reporte">
      <div class="list-toolbar__grid">
        <app-vencimiento-date-range-fields
          class="list-toolbar__dates"
          fieldClass="list-toolbar__grid-field"
          [fechaDesde]="fechaDesde()"
          [fechaHasta]="fechaHasta()"
          (fechaDesdeChange)="fechaDesdeChange.emit($event)"
          (fechaHastaChange)="fechaHastaChange.emit($event)"
        />

        <mat-form-field appearance="outline" class="list-toolbar__grid-field" subscriptSizing="dynamic">
          <mat-label>Ramo</mat-label>
          <mat-select [ngModel]="ramoId()" (ngModelChange)="ramoIdChange.emit($event)">
            <mat-option [value]="null">Todos</mat-option>
            @for (ramo of ramos(); track ramo.id) {
              <mat-option [value]="ramo.id">{{ ramo.nombre }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>
    </section>
  }
</div>
