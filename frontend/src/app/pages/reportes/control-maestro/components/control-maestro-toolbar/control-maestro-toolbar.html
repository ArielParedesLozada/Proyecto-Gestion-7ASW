<div class="toolbar-card">
    <div class="toolbar-card__left">

        <mat-form-field appearance="outline" class="toolbar__search">
            <mat-label>Vence desde</mat-label>
            <input matInput [matDatepicker]="pickerDesde" [ngModel]="fechaDesde()"
                (ngModelChange)="fechaDesdeChange.emit($event)" />
            <mat-datepicker-toggle matSuffix [for]="pickerDesde" />
            <mat-datepicker #pickerDesde />
        </mat-form-field>

        <mat-form-field appearance="outline" class="toolbar__search">
            <mat-label>Vence hasta</mat-label>
            <input matInput [matDatepicker]="pickerHasta" [ngModel]="fechaHasta()"
                (ngModelChange)="fechaHastaChange.emit($event)" />
            <mat-datepicker-toggle matSuffix [for]="pickerHasta" />
            <mat-datepicker #pickerHasta />
        </mat-form-field>

        <mat-form-field appearance="outline" class="toolbar__select">
            <mat-label>Ramo</mat-label>
            <mat-select [ngModel]="ramoId()" (ngModelChange)="ramoIdChange.emit($event)">
                <mat-option [value]="null">Todos</mat-option>

                @for (ramo of ramos(); track ramo.id) {
                <mat-option [value]="ramo.id">{{ ramo.nombre }}</mat-option>
                }
            </mat-select>
        </mat-form-field>

    </div>
</div>
