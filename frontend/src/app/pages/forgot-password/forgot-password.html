<div class="container">
  <div class="card">

    <!-- Logo -->
    <div class="logo-container">
      <img src="/img/Gobierno.png" alt="Gobierno Provincial">
      <h3>Honorable Gobierno<br>Provincial de Tungurahua</h3>
    </div>

    <!-- Title -->
    <h1>¿Olvidaste tu contraseña?</h1>
    <p class="subtitle">
      Ingresa tu correo electrónico registrado para enviarte un enlace de recuperación.
    </p>

    <!-- Form -->
    <form (ngSubmit)="onSubmit()">

      <label>Correo Electrónico</label>

      <div class="input-group">
        <span class="icon">✉️</span>
        <input
          type="email"
          [value]="email()"
          (input)="email.set($any($event.target).value); clearError()"
          placeholder="Ingresa tu correo electrónico"
          [disabled]="isLoading()"
          required
        />
      </div>

      <!-- ❌ Error -->
      @if (errorMessage()) {
        <div class="error-message">
          {{ errorMessage() }}
        </div>
      }

      <!-- ✅ Success -->
      @if (successMessage()) {
        <div class="success-message">
          {{ successMessage() }}
        </div>
      }

      <!-- Button -->
      <button type="submit" [disabled]="isLoading()">
        @if (isLoading()) {
          <span>Enviando enlace...</span>
        } @else {
          <span>Enviar enlace de reinicio →</span>
        }
      </button>

    </form>

    <!-- Back -->
    <a routerLink="/login" class="back-link">
      ← Volver al inicio de sesión
    </a>

  </div>
</div>
