<div class="forgot-container">
  <!-- Sección izquierda -->
  <div class="forgot-left">
    <div class="logo-container">
      <img src="/img/Gobierno.png" alt="Logo" class="logo" />
    </div>
  </div>

  <!-- Sección derecha -->
  <div class="forgot-right">
    <div class="forgot-form-container">
      <h1 class="forgot-title">
        <span class="title-line-1">Reestablece</span>
        <span class="title-line-2">contraseña</span>
      </h1>

      <p class="forgot-subtitle">
        Ingresa tu correo electrónico
      </p>

      <form (ngSubmit)="onSubmit()" class="forgot-form">

        <div class="form-group">
          <label for="email">Correo electrónico:</label>
          <div class="input-wrapper">
            <div class="icon-box">
              <!-- icono mail -->
              <svg class="input-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path
                  d="M2.5 5.83333C2.5 4.91286 3.24619 4.16667 4.16667 4.16667H15.8333C16.7538 4.16667 17.5 4.91286 17.5 5.83333V14.1667C17.5 15.0871 16.7538 15.8333 15.8333 15.8333H4.16667C3.24619 15.8333 2.5 15.0871 2.5 14.1667V5.83333Z"
                  stroke="white" stroke-width="1.5" />
                <path d="M2.5 6.66667L10 11.25L17.5 6.66667" stroke="white" stroke-width="1.5" stroke-linecap="round" />
              </svg>
            </div>
            <input type="email" id="email" name="email" [value]="email()"
              (input)="email.set($any($event.target).value); clearError()" placeholder="Ingrese su correo"
              class="form-input" required [disabled]="isLoading()" />
          </div>
        </div>

        @if (errorMessage()) {
        <div class="error-message">
          {{ errorMessage() }}
        </div>
        }
        @if (successMessage()) {
        <div class="success-message">
          {{ successMessage() }}
        </div>
        }

        <button type="submit" class="forgot-button" [disabled]="isLoading()">
          @if (isLoading()) {
          <span>Enviando...</span>
          } @else {
          <span>Enviar correo de recuperación</span>
          }
        </button>
      </form>

      <div class="forgot-links">
        <a routerLink="/login" class="link-red">¿Ya tienes una cuenta?</a>
      </div>

    </div>
  </div>
</div>
