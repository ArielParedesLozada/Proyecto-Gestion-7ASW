<header class="polizas-header">
    <div>
      <a routerLink="/empresas" class="empresas-placeholder__back">← Volver a empresas</a>
      <h1 class="page-title">Empresa</h1>
      <p class="page-subtitle">Identificador: {{ id }}</p>
    </div>
    <div class="polizas-header__tools">
      <button type="button" class="polizas-header__notif" aria-label="Notificaciones">
        <mat-icon>notifications</mat-icon>
        <span class="polizas-header__notif-dot" aria-hidden="true"></span>
      </button>
      <mat-icon class="polizas-header__profile" aria-hidden="true">account_circle</mat-icon>
    </div>
  </header>

  <div class="empresas-placeholder__card">
    <p>Vista de detalle reservada; aquí se mostrará la ficha de la empresa al integrar backend.</p>
  </div>
