<div class="empresas-card">
  <h2 class="empresas-card__title">Lista de Empresas</h2>

  <div class="table-scroll">
    <table class="empresas-table">
      <thead>
        <tr>
          <th>Nombre de la Empresa</th>
          <th>Correo Electrónico</th>
          <th class="empresas-table__col-actions">Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (row of rows(); track row.id) {
          <tr>
            <td class="empresas-table__nombre">{{ row.nombre }}</td>
            <td class="empresas-table__correo">{{ row.correo }}</td>
            <td>
              <div class="empresas-table__actions">
                <button
                  type="button"
                  mat-icon-button
                  class="action-btn"
                  aria-label="Editar"
                  (click)="onEditar(row)"
                >
                  <mat-icon>edit_square</mat-icon>
                </button>
              </div>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="3" class="empresas-table__empty">No hay empresas registradas.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <div class="empresas-card__paginator">
    <app-local-paginator
      [length]="paginatorLength()"
      [pageIndex]="pageIndex()"
      [pageSize]="pageSize()"
      (page)="pageChange.emit($event)"
    />
  </div>
</div>
