<app-main-layout>
    <div class="dashboard-header">
        <div>
            <h1>Dashboard</h1>
            <p>Bienvenido al Sistema de Control de Pólizas</p>
        </div>

        <div class="user-avatar">
            <span>👤</span>
        </div>
    </div>

    <!-- CARDS -->
    <div class="dashboard-cards">

        <div class="card card-primary">
            <div class="icon">+</div>
            <div>
                <h3>Nueva Póliza</h3>
                <p>Registrar póliza</p>
            </div>
        </div>

        <div class="card card-info">
            <div class="icon">📊</div>
            <div>
                <h3>Reportes</h3>
                <p>Generar reportes</p>
            </div>
        </div>

        <div class="card card-success">
            <div class="icon">🔄</div>
            <div>
                <h3>Renovaciones</h3>
                <p>Gestionar renovaciones</p>
            </div>
        </div>

    </div>
    <app-table [columns]="columns()" [data]="data"></app-table>

    <!-- TEMPLATE: ESTADO -->
    <ng-template #estadoTpl let-row>
        <span class="badge">
            {{ row.estado }}
        </span>
    </ng-template>

    <!-- TEMPLATE: ACCIONES -->
    <ng-template #accionesTpl let-row>
        <a class="link">Ver Detalles</a>
    </ng-template>
</app-main-layout>
