<!-- HEADER -->
<div class="dashboard-header">
  <div>
    <h1 class="page-title">Dashboard</h1>
    <p class="page-subtitle">Bienvenido al Sistema de Control de Pólizas</p>
  </div>
  <div class="user-avatar">
    <app-header-user-menu />
  </div>
</div>

<!-- CARDS -->
<div class="dashboard-cards">
  <div class="card" role="button" tabindex="0" (click)="irNuevaPoliza()" (keydown.enter)="irNuevaPoliza()">
    <div class="card-icon card-icon--primary">
      <mat-icon>add_circle</mat-icon>
    </div>
    <div class="card-body">
      <h3>Nueva Póliza</h3>
      <p>Registrar póliza</p>
    </div>
  </div>

  <div class="card" role="button" tabindex="0" (click)="irReportes()" (keydown.enter)="irReportes()">
    <div class="card-icon card-icon--info">
      <mat-icon>bar_chart</mat-icon>
    </div>
    <div class="card-body">
      <h3>Reportes</h3>
      <p>Generar reportes</p>
    </div>
  </div>

  <div class="card" role="button" tabindex="0" (click)="irRenovaciones()" (keydown.enter)="irRenovaciones()">
    <div class="card-icon card-icon--success">
      <mat-icon>autorenew</mat-icon>
    </div>
    <div class="card-body">
      <h3>Renovaciones</h3>
      <p>Gestionar renovaciones</p>
    </div>
  </div>
</div>

<section class="dashboard-polizas" aria-labelledby="dashboard-polizas-title">
  <app-polizas-table
    variant="dashboard"
    tableTitle="Pólizas próximas a vencer"
    tableSubtitle="Seguimiento de vencimientos"
    verTodasLink="/polizas"
    [showPaginator]="false"
    [rows]="dashboardRows()"
    (ver)="onVerPoliza($event)"
  />
</section>
