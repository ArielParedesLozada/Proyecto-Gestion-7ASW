<div class="reset-container">

  <div class="reset-right">
    <div class="reset-form-container">

      <h1 class="reset-title">
        Nueva contraseña
      </h1>

      <form (ngSubmit)="onSubmit()">

        <div class="form-group">
          <label>Contraseña:</label>
          <input type="password"
                 [value]="password()"
                 (input)="password.set($any($event.target).value); clearError()"
                 class="form-input" />
        </div>

        <div class="form-group">
          <label>Confirmar contraseña:</label>
          <input type="password"
                 [value]="confirmPassword()"
                 (input)="confirmPassword.set($any($event.target).value); clearError()"
                 class="form-input" />
        </div>

        @if (errorMessage()) {
          <div class="error-message">
            {{ errorMessage() }}
          </div>
        }

        @if (successMessage()) {
          <div class="success-message">
            {{ successMessage() }}
          </div>
        }

        <button class="reset-button" type="submit" [disabled]="isLoading()">
          @if (isLoading()) {
            <span>Procesando...</span>
          } @else {
            <span>Restablecer contraseña</span>
          }
        </button>

      </form>

    </div>
  </div>
</div>
