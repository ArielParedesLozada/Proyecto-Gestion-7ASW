<app-sicop-data-table
  title="Lista de Ramos"
  [paginatorLength]="paginatorLength()"
  [pageIndex]="pageIndex()"
  [pageSize]="pageSize()"
  (pageChange)="pageChange.emit($event)"
>
  <tr sicopThead>
    <th>Nombre</th>
    <th>Descripción</th>
    <th>Cambio Valor</th>
    <th class="sicop-data-table__col-actions">Acciones</th>
  </tr>

  @for (row of rows(); track row.id) {
    <tr>
      <td class="sicop-data-table__cell--strong">{{ row.nombre }}</td>
      <td class="sicop-data-table__cell--muted">{{ row.descripcion }}</td>
      <td>
        <app-ramo-cambio-valor-badge [cambioValor]="row.cambioValor" />
      </td>
      <td>
        <div class="sicop-data-table__actions">
          <button
            type="button"
            mat-icon-button
            class="sicop-data-table__action-btn"
            aria-label="Editar"
            (click)="onEditar(row)"
          >
            <mat-icon>edit_square</mat-icon>
          </button>
        </div>
      </td>
    </tr>
  } @empty {
    <tr>
      <td colspan="4" class="sicop-data-table__empty">No hay ramos registrados.</td>
    </tr>
  }
</app-sicop-data-table>
