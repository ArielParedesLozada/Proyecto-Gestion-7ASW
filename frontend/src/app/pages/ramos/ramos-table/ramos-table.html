<div class="ramos-card">
  <h2 class="ramos-card__title">Lista de Ramos</h2>

  <div class="table-scroll">
    <table class="ramos-table">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Descripción</th>
          <th>Periodicidad</th>
          <th>Cambio Valor</th>
          <th class="ramos-table__col-actions">Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (row of rows(); track row.id) {
          <tr>
            <td class="ramos-table__nombre">{{ row.nombre }}</td>
            <td class="ramos-table__desc">{{ row.descripcion }}</td>
            <td class="ramos-table__desc">{{ row.periodicity | formatTimespan }}</td>
            <td>
              <app-ramo-cambio-valor-badge [cambioValor]="row.cambioValor" />
            </td>
            <td>
              <div class="ramos-table__actions">
                <button
                  type="button"
                  mat-icon-button
                  class="action-btn"
                  aria-label="Editar"
                  (click)="onEditar(row)"
                >
                  <mat-icon>edit_square</mat-icon>
                </button>
              </div>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="4" class="ramos-table__empty">No hay ramos registrados.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <div class="ramos-card__paginator">
    <app-local-paginator
      [length]="paginatorLength()"
      [pageIndex]="pageIndex()"
      [pageSize]="pageSize()"
      (page)="pageChange.emit($event)"
    />
  </div>
</div>
