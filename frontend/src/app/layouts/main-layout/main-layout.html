<div
  class="layout"
  [class.collapsed]="!isMobile() && isCollapsed()"
  [class.layout--mobile]="isMobile()"
  [class.layout--mobile-nav-open]="isMobile() && mobileMenuOpen()"
>

  @if (isMobile() && mobileMenuOpen()) {
    <button
      type="button"
      class="layout-backdrop"
      aria-label="Cerrar menú de navegación"
      (click)="closeMobileMenu()"
    ></button>
  }

  @if (isMobile()) {
    <header class="mobile-topbar">
      <button
        type="button"
        mat-icon-button
        class="mobile-topbar__menu-btn"
        data-testid="nav-menu-toggle"
        [attr.aria-expanded]="mobileMenuOpen()"
        aria-label="Abrir menú de navegación"
        (click)="toggleMobileMenu()"
      >
        <mat-icon>{{ mobileMenuOpen() ? 'close' : 'menu' }}</mat-icon>
      </button>
      <div class="mobile-topbar__brand">
        <img src="/img/Gobierno.png" alt="" class="mobile-topbar__logo" />
        <span class="mobile-topbar__title">SICOP</span>
      </div>
      <app-page-header-actions variant="topbar" class="mobile-topbar__actions" />
    </header>
  }

  <aside
    class="sidebar"
    [attr.aria-hidden]="isMobile() && !mobileMenuOpen()"
    [attr.inert]="isMobile() && !mobileMenuOpen() ? true : null"
  >
    <div class="sidebar-header">
      <img src="/img/Gobierno.png" alt="Logo Gobierno" />
      @if (sidebarLabelsVisible()) {
        <h2>Sistema de Control de Pólizas</h2>
      }
    </div>

    @if (!isMobile()) {
      <button type="button" class="toggle-btn" aria-label="Colapsar menú lateral" (click)="toggleSidebar()">
        <mat-icon>{{ isCollapsed() ? 'menu' : 'menu_open' }}</mat-icon>
      </button>
    }

    <app-sidebar-nav
      [labelsVisible]="sidebarLabelsVisible()"
      [showAdminLinks]="canShowAdminStuff()"
      (navItemActivated)="closeMobileMenu()"
    ></app-sidebar-nav>

    <div class="sidebar-footer">
      @if (sidebarLabelsVisible()) {
        <mat-icon class="logout-icon" aria-hidden="true">logout</mat-icon>
        <app-button (action)="logout()">Cerrar Sesión</app-button>
      } @else {
        <button type="button" class="sidebar-footer__icon-btn" aria-label="Cerrar sesión" (click)="logout()">
          <mat-icon>logout</mat-icon>
        </button>
      }
    </div>
  </aside>

  <div class="content sicop-content-padding">
    <router-outlet />
  </div>

</div>
